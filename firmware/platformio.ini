; WadiWatch firmware.
;   Tests on a PC:      pio test -e native
;   Build for ESP32:    pio run

[platformio]
default_envs = wadi_node, siren_node, gateway

[env]
test_framework = unity

; Runs the portable cores against fake ports. No hardware needed.
[env:native]
platform = native
build_flags = -std=gnu++14 -Wall -Wextra
test_build_src = no

[esp32]
platform = espressif32
framework = arduino
; Change to match the board in hand (for example ttgo-lora32-v1 or heltec_wifi_lora_32_V2).
board = esp32dev
monitor_speed = 115200
build_flags = -Wall -Wextra
test_ignore = *

[env:wadi_node]
extends = esp32
build_src_filter = +<esp32/> +<wadi_node/>

[env:siren_node]
extends = esp32
build_src_filter = +<esp32/> +<siren_node/>

[env:gateway]
extends = esp32
build_src_filter = +<esp32/> +<gateway/>
