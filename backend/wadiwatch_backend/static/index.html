<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WadiWatch dashboard</title>
  <!-- Leaflet is the only outside dependency. Without it the node list still works. -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="static/dashboard.css">
  <script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script defer src="static/dashboard.js"></script>
</head>
<body>
  <header class="bar">
    <div class="bar__title">
      <h1>WadiWatch</h1>
      <p id="site-name">Loading the site</p>
    </div>
    <p id="summary" class="summary summary--unknown" role="status" aria-live="polite">Waiting for data</p>
    <p id="connection" class="connection" role="status">Connecting</p>
  </header>

  <main class="layout">
    <section class="map" aria-label="Map of nodes coloured by alert level">
      <div id="map"></div>
      <p id="placeholder-note" class="map__note" hidden>
        Node positions are placeholders, not surveyed locations.
      </p>
    </section>

    <aside class="panel" aria-label="Nodes">
      <h2>Nodes</h2>
      <ul id="node-list" class="nodes"></ul>

      <h2>Alert levels</h2>
      <ul class="legend">
        <li><span class="swatch level--none"></span>No alert</li>
        <li><span class="swatch level--watch"></span>Watch</li>
        <li><span class="swatch level--warning"></span>Warning</li>
        <li><span class="swatch level--evacuate"></span>Evacuate</li>
        <li><span class="swatch level--silent"></span>Never heard from</li>
      </ul>
      <ul class="legend legend--shapes">
        <li><span class="pin pin--wadi_node level--plain"></span>Wadi node</li>
        <li><span class="pin pin--siren_node level--plain"></span>Siren node</li>
        <li><span class="pin pin--gateway"></span>Gateway</li>
      </ul>
    </aside>
  </main>
</body>
</html>
